[project]
name = "covalent-lite"
version = "0.1.0"
description = "Covalent Lite runtime product scaffold (CLI/API not implemented yet)."
requires-python = ">=3.12"
dependencies = ["covalent-contracts==0.1.0", "covalent-runtime==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covalent_lite"]
