[project]
name = "covalent-desktop"
version = "0.1.0"
description = "Covalent Desktop service scaffold (sidecar not implemented yet)."
requires-python = ">=3.12"
dependencies = ["covalent-contracts==0.1.0", "covalent-runtime==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covalent_desktop"]
