[project]
name = "covalent-enterprise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "covalent-contracts==0.1.0",
    "covalent-runtime==0.1.0",
    "covalent-agent-kit[documents,browser]==0.1.0",
    "covalent-execution-native==0.1.0",
    "covalent-execution-docker==0.1.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "greenlet>=3.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.12.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.40",
    "uvicorn>=0.34.0",
    "typer>=0.12.0"
]

[project.scripts]
covalent-enterprise = "covalent_enterprise.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covalent_enterprise"]
