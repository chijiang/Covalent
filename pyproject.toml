[project]
name = "agent-framework"
version = "0.1.0"
description = "Covalent workspace and legacy Enterprise compatibility imports."
requires-python = ">=3.12"
dependencies = ["covalent-enterprise==0.1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.4", "ruff>=0.12"]

[tool.uv.workspace]
members = ["packages/python/*", "products/enterprise/backend", "products/lite/service", "products/desktop/service"]

[tool.uv.sources]
covalent-contracts = { workspace = true }
covalent-runtime = { workspace = true }
covalent-agent-kit = { workspace = true }
covalent-execution-native = { workspace = true }
covalent-execution-docker = { workspace = true }
covalent-enterprise = { workspace = true }
covalent-lite = { workspace = true }
covalent-desktop = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covalent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
