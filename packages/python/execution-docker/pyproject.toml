[project]
name = "covalent-execution-docker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "covalent-runtime==0.1.0",
    "covalent-execution-native==0.1.0",
    "docker>=7.2.0"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covalent_execution_docker"]
