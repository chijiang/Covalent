[project]
name = "covalent-agent-kit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "covalent-runtime==0.1.0",
    "covalent-contracts==0.1.0",
    "covalent-execution-native==0.1.0",
    "anyio>=4.11.0",
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "openai>=1.63.2",
    "pyyaml>=6.0",
    "socksio>=1.0.0"
]

[project.optional-dependencies]
documents = ["pymupdf>=1.27.2.3", "openpyxl>=3.1.5", "python-pptx>=1.0.2"]
browser = ["playwright>=1.49.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covalent_agent_kit"]
